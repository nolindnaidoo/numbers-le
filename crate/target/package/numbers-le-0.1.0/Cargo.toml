[package]
edition = "2024"
rust-version = "1.88"
name = "numbers-le"
version = "0.1.0"
authors = ["Nolin D Naidoo"]
build = false
exclude = [
    "AGENTS.md",
    "CLAUDE.md",
    "rust-toolchain.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Find every hardcoded number in a codebase so a person can check them"
homepage = "https://letools.dev/tools/numbers-le"
readme = "README.md"
keywords = [
    "numbers",
    "extract",
    "audit",
    "verification",
    "cli",
]
categories = [
    "command-line-utilities",
    "development-tools",
    "text-processing",
]
license = "MIT"
repository = "https://github.com/nolindnaidoo/numbers-le"

[[bin]]
name = "numbers-le"
path = "src/main.rs"

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"

[dependencies.csv]
version = "1"

[dependencies.ignore]
version = "0.4"

[dependencies.jsonc-parser]
version = "0.33"

[dependencies.regex]
version = "1"

[dependencies.rust-ini]
version = "0.21"

[dependencies.saphyr]
version = "0.0.11"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"
features = ["raw_value"]

[dependencies.toml]
