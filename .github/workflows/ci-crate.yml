# The Rust CLI's CI. Lives beside ci.yml rather than inside it because
# ci.yml is byte-identical across the ten *-le repos (letools-site's
# fleet check); this file is invisible to that check.
#
# Paths include the extension's extraction sources on purpose: parity
# must fail when EITHER side drifts from the shared corpus, and an edit
# to src/extraction/heuristics.ts would otherwise land green.
name: CI (crate)

on:
  # Manually runnable as well as push-triggered. Push events are not
  # guaranteed: during a GitHub Actions incident they are throttled and
  # silently dropped, and a dropped event never replays — leaving a
  # commit with no way to be verified. Dispatch is the escape hatch.
  # ci.yml cannot have this: it is byte-identical across the ten *-le
  # repos and the fleet check enforces that.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - 'src/extraction/**'
      - 'src/mcp/**'
      - 'scripts/check-extraction-parity.ts'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'
  pull_request:
    paths:
      - 'crate/**'
      - 'src/extraction/**'
      - 'src/mcp/**'
      - 'scripts/check-extraction-parity.ts'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  # Whether anything the Rust jobs depend on actually moved. "Docs" is
  # deliberately narrow — *.md, LICENSE and the agent instruction files —
  # and anything unrecognised, or an unreadable diff, counts as code. The
  # default is always to run more, never less.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            range="$before..HEAD"
          fi

          if ! files="$(git diff --name-only "$range")"; then files=""; fi

          code=false
          if [ -z "$files" ]; then code=true; fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md | LICENSE | .cursorrules | .windsurfrules | .clinerules) ;;
              .cursor/* | .github/copilot-instructions.md) ;;
              *) code=true; break ;;
            esac
          done <<EOF
          $files
          EOF

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code, files changed:"
          echo "$files"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rn '#\[allow(' crate/src --include='*.rs'; then
            echo 'Inline #[allow] found — fix the lint or relax it in [lints.clippy] in crate/Cargo.toml.'
            exit 1
          fi
      # extract/ is the layer the corpus pins and the layer that must
      # stay pure. A filesystem call in it means the "testable from a
      # fixture file, no flake" claim in AGENTS.md has quietly stopped
      # being true.
      - name: Forbid filesystem access in the pure extraction layer
        working-directory: .
        run: |
          # Comment lines are filtered out: the module doc in
          # extract/mod.rs names `std::fs` to say it must not appear.
          if grep -rn 'std::fs\|File::open' crate/src/extract --include='*.rs' \
             | grep -v ':[0-9]*: *//'; then
            echo 'extract/ must not touch the filesystem — that belongs in walk.rs and scan.rs.'
            exit 1
          fi
      # The two frontends share one MCP tool and nothing else. A doc that
      # says the crate must reproduce the extension's output re-imposes
      # the constraint the surfaces were deliberately freed from — and it
      # spreads, because the next SPEC.md gets written from a sibling.
      - name: Forbid a doc holding the two surfaces equal
        working-directory: .
        run: |
          hits=$(grep -rniE \
            'difference is a regression|reproduces its output exactly|is the reference implementation for' \
            --include='*.md' . 2>/dev/null | grep -vE '/target/|CHANGELOG\.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo 'Only the shared MCP tool is held equal. The surfaces are IDE-first'
            echo 'and terminal-first and are meant to differ — say which one you mean.'
            exit 1
          fi

  # AGENTS.md sets a 90% line coverage floor per module for extract/.
  # Enforced per module, not on the total: a total hides one module
  # sliding while the others carry it. Scoped to extract/ because
  # everything else is I/O verified by the contract and scenario jobs.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --html
      - name: Publish the browsable report
        # Uploaded even when the floor check fails — a failing run is
        # exactly when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: crate/target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor on extract/
        run: |
          python3 - <<'PY'
          import json, sys
          # A backstop against a module nobody tested, not a target. It sits
          # well below where the code actually is — the lowest measured module
          # in the family was 92.69% against the old 90.0 floor, i.e. 2.69
          # points from failing a build over a single new branch. A floor that
          # tracks actual coverage stops being a floor and becomes a tax on
          # writing the next module. Do not raise this to chase a number.
          FLOOR = 75.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          for f in files:
              if "/extract/" not in f["filename"]:
                  continue
              name = f["filename"].split("/")[-1]
              if name == "corpus.rs":
                  continue  # the corpus runner is test-only scaffolding
              pct = f["summary"]["lines"]["percent"]
              print(f"{name:16} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module in extract/:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  # What only a document too big for the fast path can prove: the
  # 50,000-URL cap, and that the scanner stays linear while reaching it.
  scenarios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Scenarios against an oversized document
        env:
          NUMBERS_LE_SCENARIOS: "1"
        run: cargo test --test scenarios -- --test-threads=1

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-audit
      - run: cargo audit

  # Fails when the extension's extraction behaviour and the shared
  # corpus (crate/fixtures/) disagree — the reason both frontends live
  # in one repo at all.
  parity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Extraction and MCP parity
        working-directory: .
        run: bun scripts/check-extraction-parity.ts

  # Inputs chosen to break the reader, over a tree the test builds at
  # runtime: Windows cannot check in a FIFO, a symlink loop or a
  # mode-000 file, so the cases a platform cannot express skip by name
  # rather than passing quietly. Every case asserts the same three
  # things — no panic, no hang, and an exit of 0, 1 or 2 rather than a
  # signal.
  #
  # Three of the four defects it exists for shipped: a BOM read as
  # content emptied three crates in this family, a PNG made --strict
  # exit 2 on every repository holding an image, and a non-UTF-8 file
  # vanished from the report entirely.
  hazards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Hazardous inputs, against the built binary
        run: cargo test --locked --test hazards -- --nocapture

  # Behaviour that differs by operating system, asserted rather than
  # hoped: report paths, TZ independence, case-insensitive filesystems,
  # the reserved Windows filenames, and a child that refuses before it
  # reads stdin.
  #
  # Run twice on purpose. TZ is honoured on macOS and Linux and ignored
  # on Windows, so a suite that depends on it passes on two platforms
  # and fails on the third; requiring identical results with it set and
  # with it absent is what makes the independence a check rather than a
  # claim.
  platform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Platform behaviour, with TZ set
        env:
          TZ: UTC
        run: cargo test --locked --test platform -- --nocapture
      - name: Platform behaviour, with TZ unset
        run: cargo test --locked --test platform -- --nocapture

  # The corpus pins the cases somebody thought of; this generates the
  # ones nobody did and feeds each to BOTH MCP servers.
  #
  # Scoped to the shared `extract_numbers` tool. One tool name, one
  # schema, two servers: an agent must get the same answer whichever it
  # reaches, so a divergence there is a bug. It is deliberately not a
  # comparison of the CLI against the extension — those are different
  # surfaces, one terminal-first and one IDE-first, and they are meant
  # to differ.
  #
  # The seed is fixed here and printed by the script, so a failure names
  # the document, the format and the seed that produced it.
  differential:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - run: cargo build --locked --release
      - name: Both servers, over generated documents
        working-directory: .
        env:
          DIFFERENTIAL_SEED: '20260812'
        run: bun scripts/differential-extraction.ts

  # A standing net over the pure layer — the literal scanner in
  # extract/source.rs and the strict numeric test in extract/policy.rs.
  # Those are where this crate slices, indexes and parses bytes it did
  # not write; everything else is handed a value a parser resolved.
  #
  # Time-boxed rather than run to convergence: 60 seconds a target, not
  # a proof. Any panic, any hang, any non-finite value reaching a report
  # is a failure, and proptest shrinks the input so a red build names
  # the shortest document that still breaks it.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Fuzz the literal scanner and the numeric policy
        env:
          NUMBERS_LE_FUZZ: '60'
        run: cargo test --locked --release --bin numbers-le fuzz -- --test-threads=1 --nocapture

  # A wall-clock ceiling on a fixed tree, and a linearity check beside
  # it. secrets-le was fifty times slower than its siblings for a
  # release because nothing measured it, and a position lookup went
  # quadratic on one long line for the same reason.
  #
  # The tree is generated from a fixed seed rather than checked in; the
  # ceiling is 10x a local measurement recorded in tests/budget.rs with
  # the machine it came from.
  budget:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Scan a five hundred file tree inside its budget
        env:
          NUMBERS_LE_BUDGET: '1'
        run: cargo test --locked --release --test budget -- --test-threads=1 --nocapture

  # Does this crate open what it claims to open? One file per extension
  # the alias table names, plus a dozen it has never heard of, in one
  # tree. Every one must produce a report line.
  #
  # It is also where a format offered in the tool schema with no corpus
  # document fails: seven languages were advertised with nothing in
  # fixtures/ exercising them, so nothing was checking their parity with
  # the extension however green the build was.
  coverage-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Every extension the crate names, opened
        run: cargo test --locked --test coverage_matrix -- --nocapture
